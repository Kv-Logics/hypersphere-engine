<div class="section-card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap: 1rem; flex-wrap:wrap; margin-bottom: 1.5rem;">
        <h2 style="border:none; padding:0; margin:0;">User Profiles</h2>
        <!-- Search and filters -->
        <div style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center;">
            <button onclick="openAddUserModal()" class="btn btn-contained" style="font-size:0.85rem; padding:0.5rem 1rem; border-radius:6px; font-weight:600; cursor:pointer;">+ Add User</button>
            <input type="text" id="userSearch" placeholder="Search by name or email prefix..."
                oninput="filterUsers()"
                style="border:1px solid var(--border-color); padding:0.5rem 0.85rem; border-radius:6px; font-size:0.85rem; width:220px; outline:none;">
            <select id="statusFilter" onchange="filterUsers()"
                style="border:1px solid var(--border-color); padding:0.5rem; border-radius:6px; font-size:0.85rem;">
                <option value="">All Statuses</option>
                <option value="none">No Face</option>
                <option value="registered">Registered</option>
                <option value="pending_review">Pending Review</option>
                <option value="approved">Approved</option>
            </select>
        </div>
    </div>

    <div style="overflow-x:auto;">
        <table class="attendance-table" style="font-size: 0.9rem;">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>
                        <div style="display: flex; align-items: center; gap: 0.35rem;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.8;">
                                <path d="M4 22V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v18"></path>
                                <line x1="9" y1="18" x2="9" y2="18.01"></line>
                                <line x1="15" y1="18" x2="15" y2="18.01"></line>
                                <line x1="9" y1="14" x2="9" y2="14.01"></line>
                                <line x1="15" y1="14" x2="15" y2="14.01"></line>
                                <line x1="9" y1="10" x2="9" y2="10.01"></line>
                                <line x1="15" y1="10" x2="15" y2="10.01"></line>
                                <line x1="9" y1="6" x2="9" y2="6.01"></line>
                                <line x1="15" y1="6" x2="15" y2="6.01"></line>
                            </svg>
                            Department
                        </div>
                    </th>
                    <th>Biometrics</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr>
                    <td colspan="5" style="text-align:center; padding: 3rem 0; color: var(--text-secondary);">
                        Loading user registry...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
