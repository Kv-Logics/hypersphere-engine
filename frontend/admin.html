<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Hypersphere Control Plane</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body {
            height: auto;
            overflow-y: scroll;
            background-color: #f8f9fa;
        }

        .app-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--surface);
        }

        .admin-container {
            max-width: 100%;
            margin: 2rem 2rem 2rem 0;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 2rem;
        }

        .admin-content {
            min-width: 0;
        }

        @media (max-width: 900px) {
            .admin-container {
                grid-template-columns: 1fr;
            }

            .admin-nav {
                position: static !important;
            }
        }

        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: sticky;
            top: 6rem;
            align-self: start;
        }

        .nav-tab-btn {
            background: none;
            border: none;
            text-align: left;
            padding: 0.85rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s ease;
        }

        .nav-tab-btn:hover {
            background-color: rgba(25, 118, 210, 0.05);
            color: var(--primary);
        }

        .nav-tab-btn.active {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .tab-content.active {
            display: block;
        }

        /* Stats display */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background-color: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin: 0 0 0.5rem 0;
        }

        .stat-card .value {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Requests styling */
        .request-card {
            background-color: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .comparison-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin: 1rem 0;
        }

        @media (max-width: 600px) {
            .comparison-view {
                grid-template-columns: 1fr;
            }
        }

        .photo-box {
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            aspect-ratio: 4/3;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-box .placeholder-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background-color: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--divider);
            padding-bottom: 0.75rem;
        }

        .modal-header h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            color: var(--text-primary);
            margin: 0;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- Header Bar -->
    <header class="app-bar">
        <div class="logo-area">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            <h1>HYPERSPHERE CONTROL PLANE</h1>
            <p>Admin Dashboard</p>
        </div>
        <button onclick="handleLogout()" class="btn btn-outlined" style="font-size: 0.75rem;">
            Logout
        </button>
    </header>

    <div class="admin-container">
        <!-- Sidebar tabs -->
        <nav class="admin-nav">
            <button onclick="switchTab('tabUsers')" class="nav-tab-btn active" id="btnTabUsers">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                User Management
            </button>
            <button onclick="switchTab('tabRequests')" class="nav-tab-btn" id="btnTabRequests">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                Pending Requests <span id="pendingBadge" class="badge"
                    style="background-color: var(--warning); color: var(--surface); display:none;">0</span>
            </button>
            <button onclick="switchTab('tabDrifts')" class="nav-tab-btn" id="btnTabDrifts">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6" />
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
                Drift Reviews <span id="driftBadge" class="badge"
                    style="background-color: var(--error); color: var(--surface); display:none;">0</span>
            </button>
            <button onclick="switchTab('tabReports')" class="nav-tab-btn" id="btnTabReports">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <polyline points="10 9 9 9 8 9" />
                </svg>
                Attendance Reports
            </button>
            <button onclick="switchTab('tabTester')" class="nav-tab-btn" id="btnTabTester">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                Biometric Tester
            </button>
            <button onclick="switchTab('tabPlayground')" class="nav-tab-btn" id="btnTabPlayground">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                Biometric Playground
            </button>
            <button onclick="switchTab('tabHealth')" class="nav-tab-btn" id="btnTabHealth">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="12" x2="18" y2="12" />
                    <polyline points="18 12 14 4 10 20 6 12 2 12" />
                </svg>
                System Health
            </button>
        </nav>

        <!-- Main Workspace -->
        <main class="admin-content">

            <!-- TAB: Users Management -->
            <div id="tabUsers" class="tab-content active"></div>

            <!-- TAB: Pending Approvals/Requests -->
            <div id="tabRequests" class="tab-content"></div>

            <!-- TAB: Pending Drift Reviews -->
            <div id="tabDrifts" class="tab-content"></div>

            <!-- TAB: Attendance Reports -->
            <div id="tabReports" class="tab-content"></div>

            <!-- TAB: System Health -->
            <div id="tabHealth" class="tab-content"></div>

            <!-- TAB: Biometric Tester -->
            <div id="tabTester" class="tab-content"></div>

            <!-- TAB: Biometric Playground -->
            <div id="tabPlayground" class="tab-content"></div>

        </main>
    </div>

    <!-- Modal: Admin Face Registration -->
    <div id="adminUploadModal" class="modal-overlay">
        <div class="modal-card" style="max-width: 500px;">
            <div class="modal-header">
                <h3>Register Face Profile</h3>
                <button class="close-modal" onclick="closeAdminModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Faculty User</label>
                <div id="uploadUserNameLabel" style="font-weight:600; font-size:1rem; color:var(--text-primary);">Dr. John Doe</div>
            </div>

            <!-- TAB SWITCHER -->
            <div style="display: flex; border-bottom: 1px solid var(--divider); margin-bottom: 1.25rem;">
                <button type="button" id="btnModeUpload" onclick="setRegMode('upload')" class="tab-btn active" style="flex: 1; padding: 0.5rem; background: none; border: none; border-bottom: 2px solid var(--primary); font-weight: 600; cursor: pointer; font-size: 0.85rem; outline: none;">Upload File</button>
                <button type="button" id="btnModeCamera" onclick="setRegMode('camera')" class="tab-btn" style="flex: 1; padding: 0.5rem; background: none; border: none; border-bottom: 2px solid transparent; font-weight: 500; cursor: pointer; color: var(--text-secondary); font-size: 0.85rem; outline: none;">Use Camera Feed</button>
            </div>

            <form id="adminUploadForm" onsubmit="submitAdminUpload(event)">
                <input type="hidden" id="uploadUserId">
                
                <!-- MODE 1: FILE UPLOAD -->
                <div id="regSectionUpload" class="reg-mode-section">
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="adminFile">Select Face Image</label>
                        <input type="file" id="adminFile" accept="image/*" required
                            style="border:1px solid var(--border-color); padding:0.5rem; border-radius:6px; font-size:0.9rem; width: 100%;">
                    </div>
                </div>

                <!-- MODE 2: CAMERA WEBCAM -->
                <div id="regSectionCamera" class="reg-mode-section" style="display: none;">
                    <div style="position: relative; width: 100%; height: 280px; background: #f1f3f4; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 1rem; display: flex; align-items: center; justify-content: center;">
                        <video id="adminWebcam" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
                        <canvas id="adminOverlayCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
                    </div>
                    <div style="display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem;">
                        <button type="button" id="btnStartAdminCam" onclick="toggleAdminCam()" class="btn btn-outlined" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;">Start Camera</button>
                        <button type="button" id="btnCaptureAdminFace" onclick="captureAdminFace()" class="btn btn-contained" style="font-size: 0.8rem; padding: 0.35rem 0.75rem; background-color: var(--success); display: none;">Capture & Register</button>
                    </div>
                    <div id="adminCamStatus" style="font-size: 0.8rem; color: var(--text-secondary); text-align: center; font-style: italic; min-height: 20px;">Camera is inactive.</div>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:0.75rem; border-top: 1px solid var(--divider); padding-top: 1rem; margin-top: 1rem;">
                    <button type="button" class="btn btn-outlined" onclick="closeAdminModal()">Cancel</button>
                    <button type="submit" id="btnSubmitAdminReg" class="btn btn-contained">Register Face</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add New User Profile -->
    <div id="addUserModal" class="modal-overlay">
        <div class="modal-card" style="max-width: 460px;">
            <div class="modal-header">
                <h3>Add New User Profile</h3>
                <button class="close-modal" onclick="closeAddUserModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <form id="addUserForm" onsubmit="submitAddUser(event)">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="newUserId">Username / ID (lowercase, no spaces)</label>
                    <input type="text" id="newUserId" required placeholder="e.g. john.doe"
                        style="border:1px solid var(--border-color); padding:0.5rem; border-radius:6px; font-size:0.9rem; width: 100%;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="newUserName">Full Name</label>
                    <input type="text" id="newUserName" required placeholder="e.g. Dr. John Doe"
                        style="border:1px solid var(--border-color); padding:0.5rem; border-radius:6px; font-size:0.9rem; width: 100%;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="newUserEmail">Email Address</label>
                    <input type="email" id="newUserEmail" placeholder="e.g. john@nitt.edu"
                        style="border:1px solid var(--border-color); padding:0.5rem; border-radius:6px; font-size:0.9rem; width: 100%;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="newUserEmpId">Employee ID</label>
                    <input type="text" id="newUserEmpId" placeholder="e.g. 1045"
                        style="border:1px solid var(--border-color); padding:0.5rem; border-radius:6px; font-size:0.9rem; width: 100%;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="newUserDept">Department</label>
                    <input type="text" id="newUserDept" placeholder="e.g. CSE"
                        style="border:1px solid var(--border-color); padding:0.5rem; border-radius:6px; font-size:0.9rem; width: 100%;">
                </div>
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="newUserRole">System Role</label>
                    <select id="newUserRole" style="border:1px solid var(--border-color); padding:0.5rem; border-radius:6px; font-size:0.9rem; width: 100%;">
                        <option value="user">User / Faculty</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.75rem; border-top: 1px solid var(--divider); padding-top: 1rem; margin-top: 1rem;">
                    <button type="button" class="btn btn-outlined" onclick="closeAddUserModal()">Cancel</button>
                    <button type="submit" class="btn btn-contained">Create Profile</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/js/admin.js" defer></script>
</body>
</html>
